aid: locbox-labs
name: LocBox Labs
description: >-
  LocBox Labs is the engineering identity behind Hownd, Inc. (formerly FetchRev,
  originally LocBox), a Tempe, Arizona automated promotions and local-merchant
  marketing platform that helps restaurants, health and beauty businesses,
  family entertainment centers, attractions and retail merchants generate new
  and repeat customers. The platform runs automated marketing across website
  popups, email drip and birthday campaigns, social media, buy-now promos,
  gift cards, a promo discovery portal, the MyHownd consumer mobile app, and
  guest-WiFi capture, billed at a flat monthly fee plus a share of each
  transaction. Merchants work in the Hownd app at hownd.app, with the legacy
  FetchRev merchant application still served at app.locbox.com. Hownd operates a
  partner-gated REST API at partner-api.hownd.com that lets approved partners
  manage subscribers on behalf of Hownd merchants; it is authenticated with
  OAuth 2.0 client-credentials against the company's Auth0 tenant and scoped per
  merchant with an X-Tenant-Id header. No OpenAPI, public API reference, or
  developer portal is published for it — the only public documentation is the
  first-party example repository in the company's LocBoxLabs GitHub org.
