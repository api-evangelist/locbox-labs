aid: locbox-labs
name: LocBox Labs
description: >-
  LocBox Labs is associated with Hownd, Inc. (formerly FetchRev), a Tempe,
  Arizona automated promotions and local-merchant marketing platform that helps
  restaurants, health and beauty businesses, family entertainment centers, and
  retail merchants generate new and repeat customers. The platform runs
  automated marketing across web popups, email drip campaigns, social media, a
  MyHownd consumer mobile app, buy-now buttons, and guest-WiFi capture on a
  pay-per-visit billing model. The merchant application runs at app.locbox.com.
  This provider was surfaced as a 500 Global portfolio company and added to the
  API Evangelist network. As of this enrichment pass no public API, developer
  portal, SDK, or OpenAPI surface could be found on the provider's public
  properties.
