apis:
- name: Hownd Partner API
  description: >-
    A secured REST API that lets an approved Hownd partner manage Subscribers on
    behalf of Hownd customers (merchants and businesses). Partners are issued
    OAuth 2.0 client credentials and retrieve a bearer token from the company's
    Auth0 tenant using the client_credentials grant with the audience
    https://partner-api.hownd.com. Every call carries an X-Tenant-Id header that
    identifies which Hownd merchant is being acted on. Hownd states the
    credentials are server-to-server only and must not be used from a browser or
    mobile application. Creating a subscriber requires an email address; first
    name, last name and phone number are optional. No OpenAPI or public
    reference is published; the surface is documented only by the first-party
    example repository below.
  humanURL: https://github.com/LocBoxLabs/hownd-examples
  baseURL: https://partner-api.hownd.com
  tags:
  - Subscribers
  - Partner API
  - Marketing
