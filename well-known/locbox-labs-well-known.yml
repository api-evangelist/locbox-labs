source: live probes of every host named in apis.yml, the Hownd merchant app bundle, and the first-party hownd-examples repository
note: >-
  The only /.well-known/ documents Hownd serves are the OAuth 2.0 / OpenID
  Connect discovery documents on hownd.auth0.com — the company's own dedicated
  Auth0 tenant, which is the authorization server the first-party
  LocBoxLabs/hownd-examples repository tells partners to call
  (https://hownd.auth0.com/oauth/token, audience https://partner-api.hownd.com).
  It is a delegated identity host rather than a hownd.com path, and that is
  recorded explicitly here rather than implied. Every /.well-known/ path on the
  marketing sites (hownd.com, fetchrev.com), on the merchant applications
  (app.locbox.com, hownd.app) and on the API hosts (partner-api.hownd.com,
  merchant-api.hownd.com, mobile-api.hownd.com, public-api.hownd.com) returned
  404 or an SPA/marketing HTML shell. hownd.app is a Netlify single-page app
  whose catch-all answers HTTP 200 with the same HTML for every path, including
  every /.well-known/* probe — those 200s are recorded below as HTML shells, not
  as documents.
