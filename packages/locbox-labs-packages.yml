note: >-
  Hownd ships NO client SDK for the Hownd Partner API in any language. The
  partner integration path is raw HTTP - the company's only published client
  code is a single Go file in LocBoxLabs/hownd-examples that fetches an Auth0
  token with net/http. The one first-party package that does exist on a public
  registry is an icon font for the company's own web front end, not an API
  client, so no SDKs pointer is emitted for this provider.
