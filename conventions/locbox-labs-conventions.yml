multi_tenancy:
  documented: true
  mechanism: header
  header: X-Tenant-Id
  value: issued by Hownd, one per Hownd customer (merchant/business)
  rationale_quote: >-
    "Arguably the Tenant ID could be used in the HTTP path. Since it is security
    related, a header felt more appropriate."
  note: >-
    Tenant scoping is the defining convention of this API - a partner holds one
    credential set and switches merchant context per request via this header.
